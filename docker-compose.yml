services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: findit-api
    restart: on-failure:3
    ports:
      - "${APP_PORT:-8094}:${APP_PORT:-8094}"
    env_file:
      - .env
    environment:
      - APP_ENV=production
      - PORT=${APP_PORT:-8094}
      - UPLOAD_DIR=/var/lib/findit/uploads
      - DB_CONNECT_RETRIES=${DB_CONNECT_RETRIES:-10}
      - DB_CONNECT_RETRY_DELAY=${DB_CONNECT_RETRY_DELAY:-3s}
    volumes:
      - findit-uploads:/var/lib/findit/uploads
    networks:
      - default
      - cashmate

volumes:
  findit-uploads:

networks:
  cashmate:
    external: true
    name: cashmate-api_cashmate-net
