services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: findit-api
    restart: on-failure:3
    ports:
      - "${APP_PORT:-8094}:${APP_PORT:-8094}"
    env_file:
      - .env
    environment:
      - APP_ENV=production
      - PORT=${APP_PORT:-8094}
      - DB_CONNECT_RETRIES=${DB_CONNECT_RETRIES:-10}
      - DB_CONNECT_RETRY_DELAY=${DB_CONNECT_RETRY_DELAY:-3s}
