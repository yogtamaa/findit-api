version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: findit-api
    restart: always
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - PORT=8080
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=${DB_USER:-findit_user}
      - DB_PASSWORD=${DB_PASSWORD:-secret_password}
      - DB_NAME=${DB_NAME:-findit_db}
      - AUTO_MIGRATE=${AUTO_MIGRATE:-false}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-*}
      - DB_MAX_IDLE_CONNS=${DB_MAX_IDLE_CONNS:-10}
      - DB_MAX_OPEN_CONNS=${DB_MAX_OPEN_CONNS:-25}
      - DB_CONN_MAX_LIFETIME=${DB_CONN_MAX_LIFETIME:-15m}
      - DB_CONN_MAX_IDLE_TIME=${DB_CONN_MAX_IDLE_TIME:-5m}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: findit-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${DB_NAME:-findit_db}
      MYSQL_USER: ${DB_USER:-findit_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret_password}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
