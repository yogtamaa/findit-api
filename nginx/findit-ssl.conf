upstream findit_api {
    server findit-api:8094;
}

server {
    listen 443 ssl;
    http2 on;

    server_name 139-190-96-203.sslip.io;

    ssl_certificate /etc/letsencrypt/live/139-190-96-203.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/139-190-96-203.sslip.io/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    location /findit/ {
        proxy_pass http://findit_api/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_read_timeout 60s;
    }
}